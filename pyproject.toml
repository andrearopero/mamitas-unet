[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mamitas"
version = "0.1.0"
description = "Binary foot segmentation (0 = background, 1 = foot) with a MobileNetV3 U-Net."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "scikit-learn",
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
